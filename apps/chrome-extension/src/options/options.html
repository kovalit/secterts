<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Secrets Center — настройки</title>
    <link rel="stylesheet" href="./options.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="ohead">
        <span class="brand-mark" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>
        </span>
        <div>
          <h1>Secrets Center</h1>
          <p>Настройки расширения</p>
        </div>
      </header>

      <div class="card">
        <label class="label" for="apiBaseUrl">API URL</label>
        <input id="apiBaseUrl" class="input" type="url" placeholder="http://localhost:8080" />

        <label class="label" for="token">Extension token</label>
        <input id="token" class="input" type="password" placeholder="sce_..." autocomplete="off" />
        <p class="hint">
          Токен создаётся в веб-приложении: Настройки → Chrome extension → Создать токен. Он даёт доступ
          на чтение паролей, храните его как секрет.
        </p>

        <div class="actions">
          <button id="save" class="btn btn-primary">Сохранить</button>
          <button id="test" class="btn">Проверить соединение</button>
        </div>

        <div id="status" class="status" hidden></div>
      </div>
    </div>

    <script type="module" src="./options.ts"></script>
  </body>
</html>
