# sqlc configuration (documented per docs/02).
#
# NOTE: the running backend uses pgx directly through internal/db/store_*.go so
# the project builds and runs without the sqlc code generator installed. This
# config + internal/db/queries/*.sql are kept so `sqlc generate` can be adopted
# later without restructuring the schema.
version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations"
    queries: "internal/db/queries"
    gen:
      go:
        package: "sqlcgen"
        out: "internal/db/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: true
